<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>致特别的你</title>
    <style>
        :root {
            --bg: #0a0a1a;
            --card: #1a1a2e;
            --text: #e0d5c1;
            --gold: #d4a853;
            --rose: #e8a0bf;
            --star: #f0e68c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            font-family: 'Georgia', 'Noto Serif SC', 'STSong', serif;
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            cursor: default;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* ============ Canvas 星空背景 ============ */
        #starCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ============ 主容器 ============ */
        .main-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        /* ============ 阶段容器 ============ */
        .stage {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: fadeSlideIn 0.8s cubic-bezier(0.23, 1, 0.32, 1);
            width: 100%;
            max-width: 600px;
        }
        .stage.active {
            display: flex;
        }

        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.06);
            }
        }

        @keyframes glow {
            0%,
            100% {
                text-shadow: 0 0 8px rgba(212, 168, 83, 0.4);
            }
            50% {
                text-shadow: 0 0 22px rgba(212, 168, 83, 0.9), 0 0 40px rgba(232, 160, 191, 0.5);
            }
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-12px);
            }
        }

        @keyframes shimmer {
            0% {
                background-position: -200% center;
            }
            100% {
                background-position: 200% center;
            }
        }

        /* ============ 标题 ============ */
        .title {
            font-size: clamp(1.6rem, 4vw, 2.6rem);
            color: var(--gold);
            margin-bottom: 1.2rem;
            letter-spacing: 0.15em;
            font-weight: normal;
            animation: glow 3s ease-in-out infinite;
        }

        .subtitle {
            font-size: 1rem;
            color: #a09080;
            margin-bottom: 2.5rem;
            letter-spacing: 0.2em;
            opacity: 0.8;
        }

        /* ============ 信封/卡片 ============ */
        .envelope-card {
            background: var(--card);
            border: 1px solid rgba(212, 168, 83, 0.25);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 460px;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.03);
            transition: box-shadow 0.6s;
        }
        .envelope-card:hover {
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.6), 0 0 40px rgba(212, 168, 83, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        .seal {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, #c0392b, #7b1f1f);
            margin: 0 auto 1.5rem;
            position: relative;
            box-shadow: 0 4px 16px rgba(192, 57, 43, 0.45);
            animation: float 4s ease-in-out infinite;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .seal:hover {
            transform: scale(1.12);
        }
        .seal::after {
            content: '♥';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.6rem;
            color: #f0d0c0;
        }

        /* ============ 按钮 ============ */
        .btn {
            display: inline-block;
            padding: 0.9rem 2.8rem;
            border-radius: 50px;
            border: 1.5px solid var(--gold);
            background: transparent;
            color: var(--gold);
            font-size: 1rem;
            letter-spacing: 0.12em;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.35s;
            position: relative;
            overflow: hidden;
            margin-top: 1.5rem;
        }
        .btn:hover {
            background: rgba(212, 168, 83, 0.1);
            box-shadow: 0 0 28px rgba(212, 168, 83, 0.3);
            transform: translateY(-2px);
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn.primary {
            background: linear-gradient(135deg, #b8860b, #d4a853);
            color: #1a1a1a;
            border: none;
            font-weight: bold;
        }
        .btn.primary:hover {
            background: linear-gradient(135deg, #c99718, #e0b860);
            box-shadow: 0 0 36px rgba(212, 168, 83, 0.5);
        }

        /* ============ 探索区域 ============ */
        .explore-area {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin: 1.5rem 0;
        }

        .memory-orb {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, rgba(255, 255, 255, 0.25), transparent 70%),
                radial-gradient(circle, var(--rose), #5b2c4a);
            cursor: pointer;
            position: relative;
            transition: all 0.4s;
            box-shadow: 0 0 18px rgba(232, 160, 191, 0.25);
            animation: float 5s ease-in-out infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #fff;
        }
        .memory-orb:nth-child(2) {
            animation-delay: -1.5s;
            background: radial-gradient(circle at 40% 35%, rgba(255, 255, 255, 0.25), transparent 70%),
                radial-gradient(circle, #a0c4e8, #3a5a7c);
        }
        .memory-orb:nth-child(3) {
            animation-delay: -3s;
            background: radial-gradient(circle at 40% 35%, rgba(255, 255, 255, 0.25), transparent 70%),
                radial-gradient(circle, #c4a0e8, #4a2c6b);
        }
        .memory-orb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 36px rgba(232, 160, 191, 0.55);
            animation: pulse 0.8s ease-in-out infinite;
        }
        .memory-orb.revealed {
            transform: scale(0.85);
            opacity: 0.5;
            pointer-events: none;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.1);
        }

        /* ============ 消息气泡 ============ */
        .message-reveal {
            background: rgba(26, 26, 46, 0.9);
            border: 1px solid rgba(212, 168, 83, 0.4);
            border-radius: 16px;
            padding: 1.5rem;
            margin-top: 1rem;
            font-style: italic;
            color: #e8d5b0;
            line-height: 1.8;
            display: none;
            animation: fadeSlideIn 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            max-width: 420px;
            width: 100%;
        }
        .message-reveal.visible {
            display: block;
        }

        /* ============ 进度条 ============ */
        .progress-dots {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 2rem 0 1rem;
        }
        .progress-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #3a3050;
            transition: all 0.4s;
        }
        .progress-dot.done {
            background: var(--gold);
            box-shadow: 0 0 10px var(--gold);
        }
        .progress-dot.current {
            background: var(--rose);
            box-shadow: 0 0 14px var(--rose);
            animation: pulse 1.2s ease-in-out infinite;
        }

        /* ============ 最终心形 ============ */
        .final-heart {
            font-size: 5rem;
            animation: float 2.5s ease-in-out infinite, glow 3s ease-in-out infinite;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .final-heart:hover {
            transform: scale(1.2);
        }

        .final-message {
            font-size: 1.3rem;
            color: var(--gold);
            letter-spacing: 0.1em;
            margin-top: 1rem;
            line-height: 2;
        }

        /* ============ 粒子爆发 ============ */
        .particle-burst {
            position: fixed;
            pointer-events: none;
            z-index: 100;
            animation: burstUp 1.5s ease-out forwards;
        }
        @keyframes burstUp {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--dx), var(--dy)) scale(0);
            }
        }

        /* ============ 响应式 ============ */
        @media (max-width: 480px) {
            .envelope-card {
                padding: 1.8rem 1.2rem;
                border-radius: 16px;
            }
            .memory-orb {
                width: 50px;
                height: 50px;
                font-size: 1.2rem;
            }
            .title {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <!-- 星空画布 -->
    <canvas id="starCanvas"></canvas>

    <!-- 主容器 -->
    <div class="main-container" id="mainContainer">

        <!-- ========== 阶段0：开场 ========== -->
        <div class="stage active" id="stage0">
            <h1 class="title">✨ 致 特别的你</h1>
            <p class="subtitle">— 一段藏在星空里的心意 —</p>
            <div class="envelope-card">
                <div class="seal" id="openSeal" title="轻轻点击打开"></div>
                <p style="color:#b0a090; font-size:0.95rem;">有一封信，藏了很久…</p>
                <p style="color:#887766; font-size:0.8rem; margin-top:0.6rem;">点击火漆印章，打开它</p>
            </div>
            <div class="progress-dots" id="progressDots">
                <span class="progress-dot current"></span>
                <span class="progress-dot"></span>
                <span class="progress-dot"></span>
                <span class="progress-dot"></span>
            </div>
        </div>

        <!-- ========== 阶段1：探索记忆 ========== -->
        <div class="stage" id="stage1">
            <h1 class="title">💫 关于我们的三件事</h1>
            <p class="subtitle">点击每一颗光球，发现藏在里面的心意</p>
            <div class="explore-area">
                <div class="memory-orb" data-orb="0" title="第一颗记忆">🌙</div>
                <div class="memory-orb" data-orb="1" title="第二颗记忆">✨</div>
                <div class="memory-orb" data-orb="2" title="第三颗记忆">💎</div>
            </div>
            <div class="message-reveal" id="revealMessage"></div>
            <button class="btn" id="btnAfterExplore" style="display:none;">继续前行 →</button>
            <div class="progress-dots" id="progressDots1">
                <span class="progress-dot done"></span>
                <span class="progress-dot current"></span>
                <span class="progress-dot"></span>
                <span class="progress-dot"></span>
            </div>
        </div>

        <!-- ========== 阶段2：最后的问题 ========== -->
        <div class="stage" id="stage2">
            <h1 class="title">💝 我想对你说</h1>
            <div class="envelope-card" style="text-align:center;">
                <div class="final-heart" id="finalHeart">❤️</div>
                <p class="final-message" id="finalMessage">
                    你愿意<br>让我走进你的世界吗？
                </p>
                <div style="display:flex;gap:1.5rem;justify-content:center;margin-top:1.5rem;flex-wrap:wrap;">
                    <button class="btn primary" id="btnYes">💖 我愿意</button>
                    <button class="btn" id="btnThink">🤔 再想想</button>
                </div>
            </div>
            <div class="progress-dots" id="progressDots2">
                <span class="progress-dot done"></span>
                <span class="progress-dot done"></span>
                <span class="progress-dot done"></span>
                <span class="progress-dot current"></span>
            </div>
        </div>

        <!-- ========== 阶段3：回应 ========== -->
        <div class="stage" id="stage3">
            <div class="envelope-card" style="text-align:center;" id="responseCard">
                <!-- 动态填充 -->
            </div>
        </div>

    </div>

    <script>
        (function() {
            // ==================== 星空背景 ====================
            const canvas = document.getElementById('starCanvas');
            const ctx = canvas.getContext('2d');
            let stars = [];
            let shootingStars = [];

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener('resize', () => {
                resizeCanvas();
                initStars();
            });

            function initStars() {
                stars = [];
                const count = Math.floor((canvas.width * canvas.height) / 1800);
                for (let i = 0; i < count; i++) {
                    stars.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        r: Math.random() * 1.8 + 0.3,
                        twinkleSpeed: Math.random() * 0.015 + 0.005,
                        twinkleOffset: Math.random() * Math.PI * 2,
                        baseAlpha: Math.random() * 0.6 + 0.4,
                    });
                }
            }
            initStars();

            function spawnShootingStar() {
                if (Math.random() < 0.015) {
                    shootingStars.push({
                        x: Math.random() * canvas.width * 0.8,
                        y: Math.random() * canvas.height * 0.5,
                        vx: (Math.random() - 0.3) * 4 + 3,
                        vy: (Math.random() - 0.3) * 1.5 + 1.5,
                        life: 1,
                        decay: Math.random() * 0.015 + 0.012,
                        trail: [],
                    });
                }
            }

            function drawStars() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const time = Date.now() * 0.001;

                for (const s of stars) {
                    const alpha = s.baseAlpha + Math.sin(time * s.twinkleSpeed * 60 + s.twinkleOffset) * 0.35;
                    const finalAlpha = Math.max(0.15, Math.min(1, alpha));
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(240,230,200,${finalAlpha})`;
                    ctx.fill();
                    if (s.r > 1.2 && finalAlpha > 0.75) {
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, s.r * 2.2, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(240,230,210,${finalAlpha * 0.12})`;
                        ctx.fill();
                    }
                }

                // Shooting stars
                for (let i = shootingStars.length - 1; i >= 0; i--) {
                    const ss = shootingStars[i];
                    ss.trail.push({ x: ss.x, y: ss.y });
                    if (ss.trail.length > 20) ss.trail.shift();
                    ss.x += ss.vx;
                    ss.y += ss.vy;
                    ss.life -= ss.decay;

                    if (ss.life <= 0 || ss.x > canvas.width + 50 || ss.y > canvas.height + 50) {
                        shootingStars.splice(i, 1);
                        continue;
                    }

                    ctx.strokeStyle = `rgba(255,255,240,${ss.life})`;
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(ss.trail[0]?.x || ss.x, ss.trail[0]?.y || ss.y);
                    for (let j = 1; j < ss.trail.length; j++) {
                        ctx.lineTo(ss.trail[j].x, ss.trail[j].y);
                    }
                    ctx.lineTo(ss.x, ss.y);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(ss.x, ss.y, 2.5, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,255,255,${ss.life})`;
                    ctx.fill();
                }
            }

            function animateStars() {
                spawnShootingStar();
                drawStars();
                requestAnimationFrame(animateStars);
            }
            animateStars();

            // ==================== 阶段管理 ====================
            const stages = document.querySelectorAll('.stage');
            let currentStage = 0;
            let orbsRevealed = 0;
            const totalOrbs = 3;

            const orbMessages = [
                "我记得第一次见到你的时候，<br>世界仿佛突然安静了几秒。<br><span style='color:#e8a0bf;'>——那是心动的起点。</span>",
                "你笑起来的时候，<br>像是整个银河都在发光。<br><span style='color:#a0c4e8;'>——我偷偷收藏了无数次。</span>",
                "每次和你聊天，<br>时间总是过得太快。<br><span style='color:#c4a0e8;'>——我希望能有更多这样的时光。</span>"
            ];

            function switchStage(index) {
                stages.forEach(s => s.classList.remove('active'));
                stages[index].classList.add('active');
                currentStage = index;
                // 滚动到视图
                stages[index].scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            // ==================== 阶段0 → 阶段1 ====================
            const openSeal = document.getElementById('openSeal');
            openSeal.addEventListener('click', () => {
                burstParticles(openSeal);
                setTimeout(() => {
                    switchStage(1);
                }, 400);
            });

            // ==================== 阶段1：探索光球 ====================
            const memoryOrbs = document.querySelectorAll('.memory-orb');
            const revealMessage = document.getElementById('revealMessage');
            const btnAfterExplore = document.getElementById('btnAfterExplore');

            memoryOrbs.forEach(orb => {
                orb.addEventListener('click', function() {
                    if (this.classList.contains('revealed')) return;
                    const idx = parseInt(this.dataset.orb);
                    this.classList.add('revealed');
                    revealMessage.innerHTML = orbMessages[idx];
                    revealMessage.classList.add('visible');
                    burstParticles(this);
                    orbsRevealed++;

                    if (orbsRevealed >= totalOrbs) {
                        setTimeout(() => {
                            revealMessage.innerHTML =
                                "💫 <span style='color:#d4a853;'>这三件事，只是万千心意的冰山一角……</span>";
                            btnAfterExplore.style.display = 'inline-block';
                            btnAfterExplore.scrollIntoView({ behavior: 'smooth' });
                        }, 600);
                    }
                });
            });

            btnAfterExplore.addEventListener('click', () => {
                switchStage(2);
            });

            // ==================== 阶段2：最终表白 ====================
            const finalHeart = document.getElementById('finalHeart');
            const btnYes = document.getElementById('btnYes');
            const btnThink = document.getElementById('btnThink');
            const responseCard = document.getElementById('responseCard');

            finalHeart.addEventListener('click', () => {
                burstParticles(finalHeart, 40);
                // 心形放大抖动
                finalHeart.style.transform = 'scale(1.4)';
                setTimeout(() => { finalHeart.style.transform = ''; }, 300);
            });

            btnYes.addEventListener('click', () => {
                switchStage(3);
                responseCard.innerHTML = `
                    <div style="font-size:4rem;animation:float 2s ease-in-out infinite;">💖</div>
                    <h2 style="color:#d4a853;margin:1rem 0;letter-spacing:0.1em;">谢谢你</h2>
                    <p style="line-height:2;color:#e0d5c1;font-size:1.1rem;">
                        这一刻，星空为我们见证。<br>
                        我会珍惜这份心意，<br>
                        用时间去书写属于我们的故事。
                    </p>
                    <p style="color:#a09080;margin-top:1rem;font-size:0.9rem;">
                        —— 2026年9月24日 · 星空之下
                    </p>
                `;
                burstParticles(responseCard, 60);
                // 全局撒花效果
                setTimeout(() => burstParticles(responseCard, 50), 500);
                setTimeout(() => burstParticles(responseCard, 40), 1000);
            });

            btnThink.addEventListener('click', () => {
                switchStage(3);
                responseCard.innerHTML = `
                    <div style="font-size:4rem;animation:float 2.5s ease-in-out infinite;">🌷</div>
                    <h2 style="color:#d4a853;margin:1rem 0;letter-spacing:0.1em;">没关系</h2>
                    <p style="line-height:2;color:#e0d5c1;font-size:1.1rem;">
                        无论你的答案是什么，<br>
                        我都感谢你愿意停留在此刻。<br>
                        这份心意不会改变。
                    </p>
                    <p style="color:#a09080;margin-top:1rem;font-size:0.9rem;">
                        慢慢来，我会一直在这里。
                    </p>
                    <button class="btn" onclick="location.reload()" style="margin-top:1rem;">🔄 再看一次</button>
                `;
                burstParticles(responseCard, 35);
            });

            // ==================== 粒子爆发效果 ====================
            function burstParticles(element, count = 25) {
                const rect = element.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                const colors = ['#d4a853', '#e8a0bf', '#f0e68c', '#a0c4e8', '#c4a0e8', '#ffb3b3', '#fff'];
                const fragment = document.createDocumentFragment();

                for (let i = 0; i < count; i++) {
                    const particle = document.createElement('span');
                    particle.className = 'particle-burst';
                    const size = Math.random() * 8 + 4;
                    const angle = Math.random() * Math.PI * 2;
                    const distance = Math.random() * 100 + 40;
                    const dx = Math.cos(angle) * distance;
                    const dy = Math.sin(angle) * distance - 40;
                    particle.style.cssText = `
                        left:${cx}px;
                        top:${cy}px;
                        width:${size}px;
                        height:${size}px;
                        border-radius:50%;
                        background:${colors[Math.floor(Math.random()*colors.length)]};
                        --dx:${dx}px;
                        --dy:${dy}px;
                        position:fixed;
                        pointer-events:none;
                        z-index:100;
                        animation:burstUp ${Math.random()*0.8+0.9}s ease-out forwards;
                    `;
                    fragment.appendChild(particle);
                }
                document.body.appendChild(fragment);

                setTimeout(() => {
                    const particles = document.querySelectorAll('.particle-burst');
                    particles.forEach(p => p.remove());
                }, 1800);
            }

            // ==================== 初始状态 ====================
            console.log('💫 星空表白页面已就绪');
            console.log('👆 点击火漆印章开始这段探索吧~');
            console.log('💝 愿每一份真心都被温柔以待。');

        })();
    </script>
</body>
</html>
