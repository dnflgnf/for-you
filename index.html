<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>为你点亮的世界</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a140a;
  font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
  touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%}
#btnAct{position:fixed;right:28px;bottom:90px;width:72px;height:72px;
  border-radius:50%;border:2.5px solid rgba(255,255,255,.5);
  background:rgba(255,255,255,.1);color:#fff;font-size:15px;letter-spacing:2px;
  display:none;align-items:center;justify-content:center;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  transition:transform .12s,background .2s,border-color .2s,box-shadow .3s;z-index:10}
#btnAct.show{display:flex}
#btnAct.ready{background:rgba(180,255,160,.3);border-color:rgba(180,255,140,.9);
  box-shadow:0 0 20px rgba(140,255,120,.45);animation:pulse 1.4s ease-in-out infinite}
#btnAct:active{transform:scale(.88)}
@keyframes pulse{0%,100%{box-shadow:0 0 14px rgba(140,255,120,.3)}
  50%{box-shadow:0 0 28px rgba(140,255,120,.7)}}
#dlg{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);
  width:min(680px,92vw);background:rgba(8,20,8,.88);
  border:1px solid rgba(180,255,180,.18);border-radius:16px;
  padding:20px 24px;color:#e8f5e0;font-size:17px;line-height:1.85;
  opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:20}
#dlg.on{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
#dlg .who{font-size:13px;color:rgba(200,255,200,.45);margin-bottom:6px}
#dlg .tap{font-size:12px;color:rgba(200,255,200,.35);text-align:right;margin-top:8px}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;z-index:30;background:rgba(4,12,4,.92);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:opacity .6s}
.ov.hide{opacity:0;pointer-events:none}
.ov h1{color:#d4ffd4;font-size:clamp(26px,6vw,42px);font-weight:700;letter-spacing:2px}
.ov p{color:rgba(200,240,200,.6);margin-top:14px;font-size:15px;text-align:center;line-height:1.9}
.ov .sub{color:rgba(200,240,200,.4);font-size:13px;margin-top:28px}
#btnStart{margin-top:32px;padding:13px 44px;border-radius:30px;border:none;
  background:linear-gradient(135deg,#5dbb63,#a8e6a3);color:#0a1f0a;font-size:17px;
  letter-spacing:3px;cursor:pointer;box-shadow:0 6px 24px rgba(90,200,90,.35);
  position:relative;z-index:31}
#btnStart:active{transform:scale(.95)}
#endBox{text-align:center}
#endBox h1{color:#c8ffc8;text-shadow:0 0 40px rgba(100,220,100,.45)}
#endBox .big{font-size:clamp(20px,5vw,30px);color:#e8f5e0;margin-top:22px;line-height:1.9}
#endBox .heart{font-size:56px;margin-top:18px;animation:beat 1s infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="btnAct">触碰</div>
<div id="dlg"><div class="who" id="dlgWho"></div><div id="dlgTxt"></div><div class="tap">轻触继续</div></div>

<div class="ov" id="ovStart">
  <h1>为你点亮的森林</h1>
  <p>拖动左下角摇杆走路 · 靠近发光的物件按「触碰」<br>把它们一个一个点亮</p>
  <button id="btnStart">开始探索</button>
  <div class="sub">电脑也可用 WASD / 方向键 + 空格</div>
</div>

<div class="ov hide" id="ovEnd">
  <div id="endBox">
    <h1 id="endTitle"></h1>
    <div class="big" id="endText"></div>
    <div class="heart">💚</div>
    <div class="sub" id="endSub"></div>
  </div>
</div>

<script>
const CONFIG = {
  herName: '她',
  yourName: '我',
  question: '做我女朋友好吗？',
  mapW: 2400, mapH: 1800,
  speed: 3.4,
  points: [
    { label:'旧信箱', x:380,  y:1420, lines:[
      '那天你回头笑了一下，我记了好久。',
      '后来每次想起，心里都像被轻轻拍了一下。']},
    { label:'长椅',   x:760,  y:1560, lines:[
      '我常坐在这张椅子上发呆。',
      '想着——要是你在旁边就好了。']},
    { label:'秋千',   x:1200, y:1380, lines:[
      '你说话的时候眼睛会亮。',
      '像夏天的星星掉进了眼睛里。']},
    { label:'路灯',   x:1620, y:1500, lines:[
      '有天晚上我走这条路，忽然很想给你发消息。',
      '打了又删，删了又打，最后还是没发出去。']},
    { label:'花丛',   x:1900, y:1200, lines:[
      '你喜欢的颜色，我都偷偷记住了。',
      '所以这片花，我想第一个指给你看。']},
    { label:'纸飞机', x:1500, y:860,  lines:[
      '有些话写了又删，最后折成了纸飞机。',
      '它飞不远，但它是往你那边飞的。']},
    { label:'喷泉',   x:900,  y:700,  lines:[
      '我把它们一个一个点亮。',
      '就像认识你的每一天，世界都比前一天亮一点。']},
    { label:'山顶',   x:500,  y:420,  lines:[
      '最后一个了。',
      '其实前面那些，都是在为这一句做准备——',
      '我喜欢你。']}
  ]
};

const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const btnAct = document.getElementById('btnAct');
const dlg = document.getElementById('dlg');
const dlgWho = document.getElementById('dlgWho');
const dlgTxt = document.getElementById('dlgTxt');
const ovStart = document.getElementById('ovStart');
const ovEnd = document.getElementById('ovEnd');
const btnStart = document.getElementById('btnStart');

let W, H;
function resize(){ W = cvs.width = innerWidth; H = cvs.height = innerHeight; }
addEventListener('resize', resize); resize();

const MAP = { w: CONFIG.mapW, h: CONFIG.mapH };
let started = false, ended = false;
let nextIdx = 0;
let cam = { x: 0, y: 0 };
const P = { x: MAP.w - 260, y: MAP.h - 260, r: 14 };
const pts = CONFIG.points;
const trees = [], flowers = [], fireflies = [];

function dist(a, b){ return Math.hypot(a.x - b.x, a.y - b.y); }

function isNearAnything(x, y, minR){
  if (dist({x,y}, P) < minR + 120) return true;
  for (const p of pts) if (dist({x,y}, p) < minR + 90) return true;
  return false;
}

function makeForest(){
  trees.length = 0; flowers.length = 0;
  const N = 420;
  for (let i = 0; i < N; i++){
    const x = Math.random() * MAP.w, y = Math.random() * MAP.h;
    if (isNearAnything(x, y, 70)) continue;
    const big = Math.random() < 0.75;
    const r = big ? 42 + Math.random()*38 : 22 + Math.random()*18;
    const h = 100 + Math.random()*50;
    const s = 28 + Math.random()*22;
    const l = 10 + Math.random()*14;
    trees.push({ x, y, r,
      trunkW: big ? 10 + Math.random()*6 : 6 + Math.random()*4,
      trunkH: big ? 28 + Math.random()*16 : 14 + Math.random()*10,
      c: `hsl(${h|0},${s|0}%,${l|0}%)`,
      c2: `hsl(${h+8|0},${s-6|0}%,${l+8|0}%)`,
      sway: Math.random()*Math.PI*2 });
  }
  for (let i = 0; i < 600; i++){
    const x = Math.random()*MAP.w, y = Math.random()*MAP.h;
    if (isNearAnything(x, y, 40)) continue;
    flowers.push({ x, y, r: 1.5+Math.random()*2.5,
      c: Math.random()<.3 ? `hsla(${40+Math.random()*30},70%,60%,.5)`
                           : `hsla(${110+Math.random()*40},40%,55%,.35)` });
  }
  for (let i = 0; i < 70; i++){
    fireflies.push({ x: Math.random()*MAP.w, y: Math.random()*MAP.h,
      vx:(Math.random()-.5)*.4, vy:(Math.random()-.5)*.4,
      phase: Math.random()*Math.PI*2, speed: .02+Math.random()*.03 });
  }
}
makeForest();

const keys = {};
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if(e.key===' ') e.preventDefault(); });
addEventListener('keyup',   e => { keys[e.key.toLowerCase()] = false; });

let joy = { on:false, id:null, sx:0, sy:0, dx:0, dy:0 };
cvs.addEventListener('touchstart', e=>{
  if (!started || ended) return;
  for (const t of e.changedTouches){
    if (t.clientX < W*.45 && !joy.on){
      joy.on=true; joy.id=t.identifier; joy.sx=t.clientX; joy.sy=t.clientY; joy.dx=joy.dy=0;
    }
  }
},{passive:true});
cvs.addEventListener('touchmove', e=>{
  for (const t of e.changedTouches){
    if (t.identifier===joy.id){
      let dx=t.clientX-joy.sx, dy=t.clientY-joy.sy;
      const m=50, d=Math.hypot(dx,dy);
      if(d>m){dx=dx/d*m; dy=dy/d*m;}
      joy.dx=dx/m; joy.dy=dy/m;
    }
  }
},{passive:true});
const endJoy = e=>{ for(const t of e.changedTouches) if(t.identifier===joy.id){joy.on=false;joy.id=null;joy.dx=joy.dy=0;} };
cvs.addEventListener('touchend', endJoy,{passive:true});
cvs.addEventListener('touchcancel', endJoy,{passive:true});

let dlgOpen=false, dlgLines=[], li=0, ci=0, typeTimer=0, typing=false;
const TYPE_MS = 55;

function openDialog(lines){
  dlgLines = lines.slice(); li = 0; ci = 0; typing = true; typeTimer = 0;
  dlgWho.textContent = CONFIG.herName;
  dlgTxt.textContent = '';
  dlg.classList.add('on'); dlgOpen = true;
  btnAct.classList.remove('show','ready');
}
function advanceDialog(){
  if (!dlgOpen) return;
  if (typing){ ci = dlgLines[li].length; typing = false; dlgTxt.textContent = dlgLines[li]; return; }
  li++;
  if (li >= dlgLines.length){ closeDialog(); onPointDone(); return; }
  ci = 0; typing = true; typeTimer = 0; dlgTxt.textContent = '';
}
dlg.addEventListener('click', advanceDialog);
dlg.addEventListener('touchend', e=>{ e.stopPropagation(); advanceDialog(); },{passive:true});

function closeDialog(){ dlg.classList.remove('on'); dlgOpen=false; typing=false; }

function onPointDone(){
  nextIdx++;
  if (nextIdx >= pts.length){ setTimeout(showEnding, 400); return; }
}

function tryAct(){
  if (dlgOpen || ended || nextIdx >= pts.length) return;
  const p = pts[nextIdx];
  if (dist(P, p) < 90) openDialog(p.lines);
}
btnAct.addEventListener('click', tryAct);
btnAct.addEventListener('touchend', e=>{ e.preventDefault(); tryAct(); },{passive:false});

function showEnding(){
  ended = true;
  document.getElementById('endTitle').textContent = CONFIG.question;
  document.getElementById('endText').textContent = `—— ${CONFIG.yourName}`;
  document.getElementById('endSub').textContent = '这片森林，从此只为你亮着。';
  ovEnd.classList.remove('hide');
  btnAct.classList.remove('show','ready');
}

function update(){
  if (!started || ended || dlgOpen) return;
  let mx=0, my=0;
  if (keys['w']||keys['arrowup']) my-=1;
  if (keys['s']||keys['arrowdown']) my+=1;
  if (keys['a']||keys['arrowleft']) mx-=1;
  if (keys['d']||keys['arrowright']) mx+=1;
  if (joy.on){ mx+=joy.dx; my+=joy.dy; }
  const d=Math.hypot(mx,my); if(d>1){mx/=d;my/=d;}
  P.x = Math.max(P.r, Math.min(MAP.w-P.r, P.x + mx*CONFIG.speed));
  P.y = Math.max(P.r, Math.min(MAP.h-P.r, P.y + my*CONFIG.speed));
  cam.x += (P.x - W/2 - cam.x)*.1;
  cam.y += (P.y - H/2 - cam.y)*.1;
  cam.x = Math.max(0, Math.min(MAP.w-W, cam.x));
  cam.y = Math.max(0, Math.min(MAP.h-H, cam.y));
  if (nextIdx < pts.length){
    const near = dist(P, pts[nextIdx]) < 90;
    btnAct.classList.toggle('show', near);
    btnAct.classList.toggle('ready', near);
  } else { btnAct.classList.remove('show','ready'); }
  if (dlgOpen && typing){
    typeTimer += 16;
    while(typeTimer>=TYPE_MS && ci<dlgLines[li].length){ ci++; dlgTxt.textContent=dlgLines[li].slice(0,ci); typeTimer-=TYPE_MS; }
  }
  for (const f of fireflies){
    f.phase += f.speed;
    f.x += f.vx + Math.sin(f.phase)*.3;
    f.y += f.vy + Math.cos(f.phase*.7)*.3;
    if (f.x<0) f.x+=MAP.w; if (f.x>MAP.w) f.x-=MAP.w;
    if (f.y<0) f.y+=MAP.h; if (f.y>MAP.h) f.y-=MAP.h;
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(Math.round(-cam.x), Math.round(-cam.y));
  const prog = nextIdx / pts.length;
  const g = ctx.createLinearGradient(0,0,0,MAP.h);
  const lo = 8+prog*7|0, hi = 16+prog*10|0;
  g.addColorStop(0, `hsl(130,28%,${lo}%)`);
  g.addColorStop(.5,`hsl(140,30%,${lo+3}%)`);
  g.addColorStop(1, `hsl(120,26%,${hi}%)`);
  ctx.fillStyle=g; ctx.fillRect(0,0,MAP.w,MAP.h);
  for (const f of flowers){ ctx.fillStyle=f.c; ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,Math.PI*2); ctx.fill(); }
  if (nextIdx>0 && nextIdx<pts.length){
    ctx.strokeStyle=`rgba(160,255,150,${.06+prog*.06})`;
    ctx.lineWidth=18; ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(pts[nextIdx-1].x,pts[nextIdx-1].y); ctx.lineTo(pts[nextIdx].x,pts[nextIdx].y); ctx.stroke();
  }
  const t = performance.now()*.001;
  for (let i=0;i<pts.length;i++){
    const p=pts[i], done=i<nextIdx, cur=i===nextIdx;
    const pulse = 1+.15*Math.sin(t*2.4+i);
    const R = done? 44 : (cur? 52*pulse : 30);
    const alpha = done?.7 : (cur?.85:.25);
    const grd=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,R*2.2);
    grd.addColorStop(0,`rgba(190,255,170,${alpha})`);
    grd.addColorStop(.45,`rgba(120,220,110,${alpha*.45})`);
    grd.addColorStop(1,'rgba(60,140,60,0)');
    ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(p.x,p.y,R*2.2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=done?'#d4ffd4':(cur?'#fff':'rgba(200,255,200,.5)');
    ctx.beginPath(); ctx.arc(p.x,p.y,done?7:6,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=done?'rgba(220,255,220,.7)':'rgba(200,255,200,.55)';
    ctx.font='600 14px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign='center'; ctx.fillText(p.label, p.x, p.y-30);
    if(!done){ ctx.font='12px sans-serif'; ctx.fillStyle='rgba(200,255,200,.4)';
      ctx.fillText(`${i+1} / ${pts.length}`, p.x, p.y+28); }
  }
  trees.sort((a,b)=>a.y-b.y);
  for (const tr of trees){
    const sw = Math.sin(t*1.2+tr.sway)*2.5;
    ctx.fillStyle='#1a120a';
    ctx.fillRect(tr.x-tr.trunkW/2+sw*.3, tr.y-tr.trunkH, tr.trunkW, tr.trunkH);
    ctx.fillStyle=tr.c;
    ctx.beginPath(); ctx.arc(tr.x+sw, tr.y-tr.r*.55, tr.r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle=tr.c2;
    ctx.beginPath(); ctx.arc(tr.x-tr.r*.28+sw, tr.y-tr.r*.3, tr.r*.72, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(tr.x+tr.r*.3+sw*.6, tr.y-tr.r*.35, tr.r*.65, 0, Math.PI*2); ctx.fill();
  }
  ctx.fillStyle='#f0c8a0';
  ctx.beginPath(); ctx.arc(P.x, P.y-22, 9, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle='#e8a0b0';
  ctx.beginPath(); ctx.moveTo(P.x,P.y-14); ctx.lineTo(P.x-13,P.y+8); ctx.lineTo(P.x+13,P.y+8); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#d07888';
  ctx.fillRect(P.x-13,P.y+4,26,4);
  for (const f of fireflies){
    const a=.25+.35*Math.abs(Math.sin(f.phase*3));
    ctx.fillStyle=`rgba(200,255,160,${a})`;
    ctx.beginPath(); ctx.arc(f.x,f.y,2.2,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
  const fog = .55 - prog*.42;
  if (fog>0){
    const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.32, W/2,H/2,Math.max(W,H)*.78);
    vg.addColorStop(0,'rgba(6,16,6,0)');
    vg.addColorStop(1,`rgba(6,16,6,${fog})`);
    ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  }
  if (joy.on){
    ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(joy.sx,joy.sy,50,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.arc(joy.sx+joy.dx*50, joy.sy+joy.dy*50, 20, 0, Math.PI*2); ctx.fill();
  }
}

(function loop(){ update(); draw(); requestAnimationFrame(loop); })();

/* ===== 关键修复：按钮点击 ===== */
function startGame(){
  if (started) return;
  ovStart.classList.add('hide');
  started = true;
}

btnStart.addEventListener('click', startGame);
btnStart.addEventListener('touchend', function(e){
  e.preventDefault();
  e.stopPropagation();
  startGame();
}, {passive:false});

addEventListener('keydown', e=>{
  if(e.key===' ' && started && !ended && !dlgOpen) tryAct();
});
</script>
</body>
</html>
